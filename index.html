<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sabionet Anim</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;background:#f6f5fa;color:#1d1b26}
body.dk{background:#0f0e14;color:#f0eef6}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:14px 32px;background:rgba(246,245,250,.9);backdrop-filter:blur(10px);border-bottom:1px solid #e7e4ef}
body.dk header{background:rgba(15,14,20,.9);border-color:#27252f}
header b{font-size:17px}header span{font-size:12.5px;color:#686577}
.seg{margin-left:auto;display:flex;background:#fff;border:1px solid #e7e4ef;border-radius:100px;padding:3px}
body.dk .seg{background:#17161f;border-color:#27252f}
.seg button{font:500 12.5px Poppins,sans-serif;border:0;background:transparent;border-radius:100px;padding:6px 14px;cursor:pointer;color:inherit}
.seg button.on{background:#1d1b26;color:#fff}body.dk .seg button.on{background:#fff;color:#1d1b26}
main{max-width:1240px;margin:0 auto;padding:10px 32px 60px}
h2{font-size:20px;margin:40px 0 16px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
figure{margin:0}figure.m{grid-column:span 2}figure.l{grid-column:1/-1}
sbn-anim{border-radius:18px;overflow:hidden;border:1px solid #e7e4ef}body.dk sbn-anim{border-color:#27252f}
figcaption{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:10px;color:#686577}
figcaption b{color:inherit;font-weight:700}body:not(.dk) figcaption b{color:#1d1b26}
figcaption code{margin-left:auto;font:500 11px ui-monospace,Menlo,monospace;background:#ece9f5;color:#6d28d9;border-radius:6px;padding:3px 7px}
body.dk figcaption code{background:#221f33;color:#c4a5ff}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}figure.m{grid-column:1/-1}}
@media (max-width:600px){.grid{grid-template-columns:1fr}main,header{padding-left:16px;padding-right:16px}}
</style></head>
<body><header><b>Sabionet Anim</b><span>Página de teste da biblioteca · v1.0.1</span>
<div class="seg"><button class="on" data-t="light">Claro</button><button data-t="dark">Escuro</button></div></header>
<main><section><h2>Criação de curso</h2><div class="grid"><figure class="s"><sbn-anim piece="CUR-01" theme="light" lang="pt"></sbn-anim><figcaption><b>CUR-01</b>Curso gerado com IA<code>&lt;sbn-anim piece="CUR-01"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="CUR-03" theme="light" lang="pt"></sbn-anim><figcaption><b>CUR-03</b>Da ideia ao curso<code>&lt;sbn-anim piece="CUR-03"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="CUR-02" theme="light" lang="pt"></sbn-anim><figcaption><b>CUR-02</b>Tipos de aula<code>&lt;sbn-anim piece="CUR-02"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="CUR-04" theme="light" lang="pt"></sbn-anim><figcaption><b>CUR-04</b>Editor de curso com IA<code>&lt;sbn-anim piece="CUR-04"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="CUR-05" theme="light" lang="pt"></sbn-anim><figcaption><b>CUR-05</b>Exames com 8 tipos de pergunta<code>&lt;sbn-anim piece="CUR-05"&gt;</code></figcaption></figure></div></section><section><h2>Landing page builder</h2><div class="grid"><figure class="s"><sbn-anim piece="LP-01" theme="light" lang="pt"></sbn-anim><figcaption><b>LP-01</b>Adicionar seção<code>&lt;sbn-anim piece="LP-01"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="LP-02" theme="light" lang="pt"></sbn-anim><figcaption><b>LP-02</b>Publicar a página<code>&lt;sbn-anim piece="LP-02"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="LP-03" theme="light" lang="pt"></sbn-anim><figcaption><b>LP-03</b>Reescrever com IA<code>&lt;sbn-anim piece="LP-03"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="LP-04" theme="light" lang="pt"></sbn-anim><figcaption><b>LP-04</b>Página de vendas montada no builder<code>&lt;sbn-anim piece="LP-04"&gt;</code></figcaption></figure></div></section><section><h2>Checkout</h2><div class="grid"><figure class="s"><sbn-anim piece="CHK-01" theme="light" lang="pt"></sbn-anim><figcaption><b>CHK-01</b>Pagamento local em cada país<code>&lt;sbn-anim piece="CHK-01"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="CHK-02" theme="light" lang="pt"></sbn-anim><figcaption><b>CHK-02</b>Checkout expresso<code>&lt;sbn-anim piece="CHK-02"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="CHK-03" theme="light" lang="pt"></sbn-anim><figcaption><b>CHK-03</b>Da compra ao acesso<code>&lt;sbn-anim piece="CHK-03"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="CHK-04" theme="light" lang="pt"></sbn-anim><figcaption><b>CHK-04</b>Da página do curso ao pagamento aprovado<code>&lt;sbn-anim piece="CHK-04"&gt;</code></figcaption></figure></div></section><section><h2>Gamificação</h2><div class="grid"><figure class="s"><sbn-anim piece="GAM-01" theme="light" lang="pt"></sbn-anim><figcaption><b>GAM-01</b>Subindo de nível<code>&lt;sbn-anim piece="GAM-01"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="GAM-02" theme="light" lang="pt"></sbn-anim><figcaption><b>GAM-02</b>Insígnia desbloqueada<code>&lt;sbn-anim piece="GAM-02"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="GAM-03" theme="light" lang="pt"></sbn-anim><figcaption><b>GAM-03</b>Configurar a gamificação<code>&lt;sbn-anim piece="GAM-03"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="GAM-04" theme="light" lang="pt"></sbn-anim><figcaption><b>GAM-04</b>Ranking ao vivo<code>&lt;sbn-anim piece="GAM-04"&gt;</code></figcaption></figure></div></section><section><h2>Área do aluno</h2><div class="grid"><figure class="s"><sbn-anim piece="ALU-04" theme="light" lang="pt"></sbn-anim><figcaption><b>ALU-04</b>Certificado emitido<code>&lt;sbn-anim piece="ALU-04"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="ALU-05" theme="light" lang="pt"></sbn-anim><figcaption><b>ALU-05</b>Aula no celular<code>&lt;sbn-anim piece="ALU-05"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="ALU-06" theme="light" lang="pt"></sbn-anim><figcaption><b>ALU-06</b>Minhas notas<code>&lt;sbn-anim piece="ALU-06"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="ALU-01" theme="light" lang="pt"></sbn-anim><figcaption><b>ALU-01</b>Aula em vídeo no player<code>&lt;sbn-anim piece="ALU-01"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="ALU-02" theme="light" lang="pt"></sbn-anim><figcaption><b>ALU-02</b>Painel do aluno em claro e escuro<code>&lt;sbn-anim piece="ALU-02"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="ALU-03" theme="light" lang="pt"></sbn-anim><figcaption><b>ALU-03</b>Do desktop ao celular<code>&lt;sbn-anim piece="ALU-03"&gt;</code></figcaption></figure></div></section><section><h2>Comunidades</h2><div class="grid"><figure class="s"><sbn-anim piece="COM-01" theme="light" lang="pt"></sbn-anim><figcaption><b>COM-01</b>Convidar membros<code>&lt;sbn-anim piece="COM-01"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="COM-02" theme="light" lang="pt"></sbn-anim><figcaption><b>COM-02</b>Pesquisa na comunidade<code>&lt;sbn-anim piece="COM-02"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="COM-03" theme="light" lang="pt"></sbn-anim><figcaption><b>COM-03</b>Comunidade no celular<code>&lt;sbn-anim piece="COM-03"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="COM-04" theme="light" lang="pt"></sbn-anim><figcaption><b>COM-04</b>Postando na comunidade<code>&lt;sbn-anim piece="COM-04"&gt;</code></figcaption></figure></div></section><section><h2>Certificados</h2><div class="grid"><figure class="s"><sbn-anim piece="CERT-01" theme="light" lang="pt"></sbn-anim><figcaption><b>CERT-01</b>Modelos de certificado<code>&lt;sbn-anim piece="CERT-01"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="CERT-02" theme="light" lang="pt"></sbn-anim><figcaption><b>CERT-02</b>Validação por QR Code<code>&lt;sbn-anim piece="CERT-02"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="CERT-03" theme="light" lang="pt"></sbn-anim><figcaption><b>CERT-03</b>Emissão automática<code>&lt;sbn-anim piece="CERT-03"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="CERT-04" theme="light" lang="pt"></sbn-anim><figcaption><b>CERT-04</b>Configurando o certificado do curso<code>&lt;sbn-anim piece="CERT-04"&gt;</code></figcaption></figure></div></section><section><h2>Gestão de usuários</h2><div class="grid"><figure class="s"><sbn-anim piece="USR-01" theme="light" lang="pt"></sbn-anim><figcaption><b>USR-01</b>Filtros avançados<code>&lt;sbn-anim piece="USR-01"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="USR-02" theme="light" lang="pt"></sbn-anim><figcaption><b>USR-02</b>Perfil do usuário<code>&lt;sbn-anim piece="USR-02"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="USR-03" theme="light" lang="pt"></sbn-anim><figcaption><b>USR-03</b>Importar usuários<code>&lt;sbn-anim piece="USR-03"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="USR-04" theme="light" lang="pt"></sbn-anim><figcaption><b>USR-04</b>Lista de usuários com filtros<code>&lt;sbn-anim piece="USR-04"&gt;</code></figcaption></figure></div></section><section><h2>Automações</h2><div class="grid"><figure class="s"><sbn-anim piece="AUT-01" theme="light" lang="pt"></sbn-anim><figcaption><b>AUT-01</b>Crie uma regra em segundos<code>&lt;sbn-anim piece="AUT-01"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="AUT-02" theme="light" lang="pt"></sbn-anim><figcaption><b>AUT-02</b>Trabalhando enquanto você dorme<code>&lt;sbn-anim piece="AUT-02"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="AUT-03" theme="light" lang="pt"></sbn-anim><figcaption><b>AUT-03</b>Uma inscrição, quatro tarefas<code>&lt;sbn-anim piece="AUT-03"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="AUT-04" theme="light" lang="pt"></sbn-anim><figcaption><b>AUT-04</b>Criando uma automação de operação<code>&lt;sbn-anim piece="AUT-04"&gt;</code></figcaption></figure></div></section><section><h2>Relatórios</h2><div class="grid"><figure class="s"><sbn-anim piece="REL-01" theme="light" lang="pt"></sbn-anim><figcaption><b>REL-01</b>Pergunte à IA<code>&lt;sbn-anim piece="REL-01"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="REL-02" theme="light" lang="pt"></sbn-anim><figcaption><b>REL-02</b>Um clique, outro gráfico<code>&lt;sbn-anim piece="REL-02"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="REL-03" theme="light" lang="pt"></sbn-anim><figcaption><b>REL-03</b>Relatórios recomendados<code>&lt;sbn-anim piece="REL-03"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="REL-04" theme="light" lang="pt"></sbn-anim><figcaption><b>REL-04</b>Audit trail: quem mudou o quê<code>&lt;sbn-anim piece="REL-04"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="REL-05" theme="light" lang="pt"></sbn-anim><figcaption><b>REL-05</b>Filtros e cores<code>&lt;sbn-anim piece="REL-05"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="REL-06" theme="light" lang="pt"></sbn-anim><figcaption><b>REL-06</b>Análises com IA, na tela completa<code>&lt;sbn-anim piece="REL-06"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="REL-07" theme="light" lang="pt"></sbn-anim><figcaption><b>REL-07</b>Seus dados, em um só lugar<code>&lt;sbn-anim piece="REL-07"&gt;</code></figcaption></figure></div></section><section><h2>Marketplace</h2><div class="grid"><figure class="s"><sbn-anim piece="MKT-02" theme="light" lang="pt"></sbn-anim><figcaption><b>MKT-02</b>O marketplace em uma imagem<code>&lt;sbn-anim piece="MKT-02"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="MKT-04" theme="light" lang="pt"></sbn-anim><figcaption><b>MKT-04</b>Publicar no marketplace<code>&lt;sbn-anim piece="MKT-04"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="MKT-05" theme="light" lang="pt"></sbn-anim><figcaption><b>MKT-05</b>Encontre o curso certo<code>&lt;sbn-anim piece="MKT-05"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="MKT-06" theme="light" lang="pt"></sbn-anim><figcaption><b>MKT-06</b>Comprar pelo celular<code>&lt;sbn-anim piece="MKT-06"&gt;</code></figcaption></figure><figure class="m"><sbn-anim piece="MKT-03" theme="light" lang="pt"></sbn-anim><figcaption><b>MKT-03</b>O marketplace montado em equipe<code>&lt;sbn-anim piece="MKT-03"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="MKT-01" theme="light" lang="pt"></sbn-anim><figcaption><b>MKT-01</b>Como o marketplace conecta todo mundo<code>&lt;sbn-anim piece="MKT-01"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="MKT-07" theme="light" lang="pt"></sbn-anim><figcaption><b>MKT-07</b>A vitrine do marketplace<code>&lt;sbn-anim piece="MKT-07"&gt;</code></figcaption></figure></div></section><section><h2>Afiliados</h2><div class="grid"><figure class="s"><sbn-anim piece="AFI-01" theme="light" lang="pt"></sbn-anim><figcaption><b>AFI-01</b>Afilie-se e pegue seu link<code>&lt;sbn-anim piece="AFI-01"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="AFI-02" theme="light" lang="pt"></sbn-anim><figcaption><b>AFI-02</b>Comissão a cada venda<code>&lt;sbn-anim piece="AFI-02"&gt;</code></figcaption></figure><figure class="s"><sbn-anim piece="AFI-03" theme="light" lang="pt"></sbn-anim><figcaption><b>AFI-03</b>Divulgue de qualquer lugar<code>&lt;sbn-anim piece="AFI-03"&gt;</code></figcaption></figure><figure class="l"><sbn-anim piece="AFI-04" theme="light" lang="pt"></sbn-anim><figcaption><b>AFI-04</b>O painel do afiliado<code>&lt;sbn-anim piece="AFI-04"&gt;</code></figcaption></figure></div></section><section><h2>Integrações</h2><div class="grid"><figure class="s"><sbn-anim piece="INT-02" theme="light" lang="pt"></sbn-anim><figcaption><b>INT-02</b>Integração em um minuto<code>&lt;sbn-anim piece="INT-02"&gt;</code></figcaption></figure><figure class="m"><sbn-anim piece="INT-01" theme="light" lang="pt"></sbn-anim><figcaption><b>INT-01</b>Tudo conectado à sua escola<code>&lt;sbn-anim piece="INT-01"&gt;</code></figcaption></figure></div></section><section><h2>Pagamentos</h2><div class="grid"><figure class="s"><sbn-anim piece="PAY-01" theme="light" lang="pt"></sbn-anim><figcaption><b>PAY-01</b>Receba do mundo todo<code>&lt;sbn-anim piece="PAY-01"&gt;</code></figcaption></figure><figure class="m"><sbn-anim piece="PAY-02" theme="light" lang="pt"></sbn-anim><figcaption><b>PAY-02</b>Todos os meios de pagamento em um lugar<code>&lt;sbn-anim piece="PAY-02"&gt;</code></figcaption></figure></div></section></main>
<script>document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));document.body.classList.toggle('dk',b.dataset.t==='dark');document.querySelectorAll('sbn-anim').forEach(e=>e.setAttribute('theme',b.dataset.t))});</script>
<script src="/v/1.0.1/sabionet-anim.js" defer></script></body></html>
